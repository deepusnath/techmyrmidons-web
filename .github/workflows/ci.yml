# The full verification gate.
#
# Every check here was previously run by hand, which is how a build made without
# NEXT_PUBLIC_SHOW_DRAFTS=false reached GitHub Pages with the editorial review
# routes publicly readable. `test:production` is the step that would have caught
# it: it builds with drafts hidden, runs scripts/check-production-artifacts.ts
# against the export, and sets DRAFTS_HIDDEN=1 so the production assertions
# actually run instead of silently skipping.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# A newer push to the same PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Pinned to the major used locally. The scripts are .ts run directly by
      # node, so they depend on type stripping being on by default.
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm

      - run: npm ci

      # Both Playwright projects (desktop Chrome, mobile Pixel 7) are Chromium.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - name: Validate content
        run: npm run validate

      - name: Rule isolation and publication gate
        run: npm run test:rules

      # Builds a preview export and exercises the review workstation.
      - name: Preview build and suite
        run: npm run test:preview

      # Builds a drafts-hidden export, runs the artifact guard, then asserts the
      # review routes, their child artifacts, every /review URL and all withheld
      # editorial are absent.
      - name: Production build, artifact guard and suite
        run: npm run test:production

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
